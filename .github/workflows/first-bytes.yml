name: First-bytes benchmark series

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Thrush revision to measure
        type: string
        required: true
        default: 0cd03d0fd191ae3469f473fb312fc7b932b55087

permissions:
  contents: read

jobs:
  measure:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          path: source
          persist-credentials: false
      - name: Measure five consecutive quiet Release runs
        run: python3 harness/scripts/measure-first-bytes.py source "$RUNNER_TEMP/first-bytes-series"
      - name: Save the five first-bytes reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thrush-first-bytes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/first-bytes-series/run-*.json
          if-no-files-found: error

name: WebAssembly package

# Builds thrush-wasm whenever the core or the package changes, and checks it against native
# ThrushCore and under Bun and Node. A published release gets the package as thrush-wasm.tgz.
on:
  push:
    branches: [main]
    paths:
      - Sources/ThrushCore/**
      - Wasm/**
      - Fixtures/reference/**
      - scripts/check-wasm.sh
      - .github/workflows/wasm.yml
  pull_request:
    paths:
      - Sources/ThrushCore/**
      - Wasm/**
      - Fixtures/reference/**
      - scripts/check-wasm.sh
      - .github/workflows/wasm.yml
  release:
    types: [published]

# A newer push supersedes a running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    container: swift:6.4.2
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Install unzip for Bun's installer and curl for wasm-opt
        run: apt-get update && apt-get install -y --no-install-recommends unzip curl ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the Wasm SDK and wasm-opt
        run: |
          swift sdk install https://download.swift.org/swift-6.4.2-release/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
          curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: Build the package and check it against native ThrushCore, Bun and Node
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then export VERSION="${TAG#v}"; fi
          scripts/check-wasm.sh
      - name: Save the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thrush-wasm-${{ github.run_id }}-${{ github.run_attempt }}
          path: Wasm/out/thrush-wasm.tgz
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: thrush-wasm-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" thrush-wasm.tgz --repo "$GITHUB_REPOSITORY"

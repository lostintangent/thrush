name: Packaged app on real PTYs

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Sample app to exercise
        type: choice
        options: [simulator, mac]
        default: simulator
      appearance:
        description: System appearance for the sample
        type: choice
        options: [dark, light]
        default: dark
      workflow:
        description: Terminal workflow to run
        type: choice
        options: [all, shell, vim, codex, lifecycle, recovery]
        default: all
      trace_lifecycle_frames:
        description: Record both ends of the scripted lifecycle WebSocket
        type: boolean
        default: false
  workflow_call:
    inputs:
      platform: { type: string, default: simulator }
      appearance: { type: string, default: dark }
      workflow: { type: string, default: all }
      trace_lifecycle_frames: { type: boolean, default: false }

permissions:
  contents: read

jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
      LIVE_PLATFORM: ${{ inputs.platform }}
      LIVE_APPEARANCE: ${{ inputs.appearance }}
      LIVE_WORKFLOW: ${{ inputs.workflow }}
      TRACE_LIFECYCLE_FRAMES: ${{ inputs.trace_lifecycle_frames }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Prepare Bash with bracketed paste
        run: |
          if [[ ! -x "$(brew --prefix)/bin/bash" ]]; then brew install bash; fi
      - name: Fetch and verify the native Codex CLI
        if: inputs.workflow == 'codex' || inputs.workflow == 'all'
        run: |
          case "$(uname -m)" in
            arm64) target=aarch64-apple-darwin
              cli=c48824462fc57681eafb0925d97b11b589010475613904f570b42fea53e240d5
              host=7abd50fe5f033495a7b693c45fb82dc57093a18f1c4ba3e8043577de46c5c7c5 ;;
            x86_64) target=x86_64-apple-darwin
              cli=db0c38713c36199b12e7c8d1629386c35a4ce8f99e1c9ce72f1725a74df67b57
              host=b35c775d5e5f8d60d05e0de7154e5bbbf320b6d0e28a3237d42cc8a742ccaf65 ;;
            *) exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          mkdir codex-release
          fetch() {
            curl --fail --location --retry 3 -o "$1.tar.gz" \
              "https://github.com/openai/codex/releases/download/rust-v0.166.0/$1-$target.tar.gz"
            echo "$2  $1.tar.gz" | shasum -a 256 --check
            tar -xzf "$1.tar.gz" -C codex-release
          }
          fetch codex "$cli"
          fetch codex-code-mode-host "$host"
          mv "codex-release/codex-$target" codex-cli
          # Codex runs its code-mode host from beside its own executable, and warns on screen without it.
          mv "codex-release/codex-code-mode-host-$target" codex-code-mode-host
          test "$(./codex-cli --version)" = "codex-cli 0.166.0"
      - name: Drive the running pane over the disposable PTY
        run: |
          flags=()
          if [[ "$LIVE_WORKFLOW" != all ]]; then flags+=(--workflow "$LIVE_WORKFLOW"); fi
          if [[ "$TRACE_LIFECYCLE_FRAMES" == true ]]; then flags+=(--trace-lifecycle-frames); fi
          if [[ -x "$RUNNER_TEMP/codex-cli" ]]; then flags+=(--codex-bin "$RUNNER_TEMP/codex-cli"); fi
          python3 -B scripts/live-workflow/launch.py \
            --platform "$LIVE_PLATFORM" --appearance "$LIVE_APPEARANCE" \
            --bash "$(brew --prefix)/bin/bash" --output "$RUNNER_TEMP/thrush-live" "${flags[@]}"
      - name: Upload native checkpoints and server observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thrush-live-${{ inputs.platform }}-${{ inputs.appearance }}-${{ inputs.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/thrush-live/
          retention-days: 7
          compression-level: 0

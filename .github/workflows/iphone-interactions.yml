name: M4 iPhone interaction proof

on:
  workflow_dispatch:
    inputs:
      accessibility_only:
        description: Exercise VoiceOver and large pane controls with reduced effects
        type: boolean
        default: false
      swipes_only:
        description: Swipe through less, vim and the shell's history on a real shell, and check each glide and stop
        type: boolean
        default: false
      links_only:
        description: Tap, long-press and open the links in the proofs app's links scene
        type: boolean
        default: false
  workflow_call:
    inputs:
      accessibility_only: { type: boolean, default: false }
      swipes_only: { type: boolean, default: false }
      links_only: { type: boolean, default: false }
  push:
    branches: [capture/m4]

permissions:
  contents: read

jobs:
  interactions:
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Verify and capture the iPhone interactions
        env:
          ACCESSIBILITY_ONLY: ${{ inputs.accessibility_only }}
          SWIPES_ONLY: ${{ inputs.swipes_only }}
          LINKS_ONLY: ${{ inputs.links_only }}
        run: |
          flags=()
          if [[ "$ACCESSIBILITY_ONLY" == true ]]; then flags+=(--accessibility-only); fi
          if [[ "$SWIPES_ONLY" == true ]]; then flags+=(--swipes-only); fi
          if [[ "$LINKS_ONLY" == true ]]; then flags+=(--links-only); fi
          python3 Tests/ThrushProofs/run.py --output "$RUNNER_TEMP/thrush-iphone-interactions" "${flags[@]}"
      - name: Upload interaction captures and checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The release tour calls this workflow twice, so each scope names its own artifact.
          name: thrush-iphone-${{ inputs.links_only && 'links' || inputs.swipes_only && 'swipes' || inputs.accessibility_only && 'accessibility' || 'interactions' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/thrush-iphone-interactions/*.png
            ${{ runner.temp }}/thrush-iphone-interactions/*.mp4
            ${{ runner.temp }}/thrush-iphone-interactions/*.json
            ${{ runner.temp }}/thrush-iphone-interactions/*.jsonl
            ${{ runner.temp }}/thrush-iphone-interactions/*.log
          compression-level: 0
          retention-days: 7

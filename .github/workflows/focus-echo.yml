name: oshen focus echo

on:
  push:
    branches: [capture/focus-echo]

permissions:
  contents: read

jobs:
  record:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch and verify oshen 0.0.1
        run: |
          case "$(uname -m)" in
            arm64) target=arm64
              checksum=e52db461280abdcd47fa302aabdeb6fc4cd819f4ea3637451e165ea98eced2b9 ;;
            x86_64) target=x86_64
              checksum=d60ec7a5e0f39a0476cdebff3765c069467d5fa0dde9c3f54985ae1b42ae80e6 ;;
            *) exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -o oshen.tar.gz \
            "https://github.com/lostintangent/oshen/releases/download/v0.0.1/oshen-macos-$target.tar.gz"
          echo "$checksum  oshen.tar.gz" | shasum -a 256 --check
          tar -xzf oshen.tar.gz oshen
          test "$(./oshen --version)" = 0.0.1
      - name: Record oshen echoing native typing on Mac and iPhone
        run: python3 -B scripts/interaction-capture/focus-echo.py --oshen "$RUNNER_TEMP/oshen" --output "$RUNNER_TEMP/focus-echo"
      - name: Upload movies, stills and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thrush-focus-echo-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/focus-echo/
          compression-level: 0
          retention-days: 7

name: Headless checks

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Full commit SHA to build and measure
        type: string
        required: true

permissions:
  contents: read

jobs:
  render:
    name: Measure packaged Mac drawable presentations
    runs-on: xcode-27
    timeout-minutes: 12
    env:
      SOURCE_REVISION: ${{ inputs.source_revision }}
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - name: Build the Release Mac bundle from the checkout
        shell: bash
        run: |
          set -o pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          mkdir -p "$RUNNER_TEMP/mac-render"
          git rev-parse HEAD | tee "$RUNNER_TEMP/mac-render/build.log"
          scripts/build-demo.sh mac 2>&1 | tee -a "$RUNNER_TEMP/mac-render/build.log"
      - name: Run the native window workload
        shell: bash
        run: |
          set -o pipefail
          swift run -c release ThrushBench --render .build/demo/mac/Thrush.app \
            --output "$RUNNER_TEMP/mac-render/render.json" 2>&1 | tee "$RUNNER_TEMP/mac-render/benchmark.log"
      - name: Validate the report and count actual drawable presentations
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check-render-report.py "$RUNNER_TEMP/mac-render/render.json" \
            2>&1 | tee "$RUNNER_TEMP/mac-render/validation.log"
          python3 - "$RUNNER_TEMP/mac-render/render.json" <<'PY' | tee -a "$RUNNER_TEMP/mac-render/validation.log" "$GITHUB_STEP_SUMMARY"
          import json
          import os
          import sys

          with open(sys.argv[1]) as stream:
              report = json.load(stream)
          environment = report["environment"]
          assert environment["commit"] == os.environ["SOURCE_REVISION"], environment
          assert environment["worktreeDirty"] is False, environment
          samples = report["samples"]
          count = sum(sample.get("presentedTime", 0) > 0 for sample in samples)
          print(f"{count} of {len(samples)} Metal drawables reported a positive presentation timestamp.")
          PY
      - name: Save the native report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thrush-mac-render
          path: |
            ${{ runner.temp }}/mac-render/render.json
            ${{ runner.temp }}/mac-render/*.log
          retention-days: 7

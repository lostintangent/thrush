name: Headless checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.png"
      - "Wasm/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.png"
      - "Wasm/**"
  workflow_dispatch:
    inputs:
      scene:
        description: Named demo scene (leave empty for the full iPhone proof)
        type: string
        required: false
      appearance:
        description: System appearance for a named scene
        type: choice
        options: [dark, light]
        default: dark
      orientation:
        description: Native scene orientation for a named capture
        type: choice
        options: [portrait, landscape]
        default: portrait
      keyboard:
        description: Expected software keyboard for a named capture
        type: choice
        options: [any, visible, hidden]
        default: any
      layout_only:
        description: Measure a named scene's settled keyboard and grid
        type: boolean
        default: false
      oracle:
        description: Optional repository-relative Python screenshot checker under scripts/
        type: string
        required: false

# Every push to main runs to completion, and a newer push waits rather than cancelling it.
# A newer pull request push supersedes the running check. Each dispatched capture keeps its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          swift build
          swift test
      - name: Build the Mac and iPhone Simulator proofs apps
        run: |
          scripts/build-app.sh proofs mac
          scripts/build-app.sh proofs simulator
      - name: Check core imports and package dependencies
        run: scripts/check-core.sh
      - name: Link the public Thrush product for iPhone and iPhone Simulator, and wrap the simulator sample
        run: |
          scripts/check-swiftui-example.sh device
          scripts/check-swiftui-example.sh simulator
          scripts/build-app.sh sample simulator
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Check conformance against the pinned reference
        run: scripts/check-conformance.sh
      - name: Verify the loopback exchange
        run: scripts/check-loopback.sh
      - name: Verify recorded shell, Vim and Codex workflows over WebSocket
        run: scripts/check-workflows.sh
      - name: Verify the Release benchmarks
        run: |
          swift run -c release ThrushBench
          python3 scripts/check-benchmark-report.py

  iphone-tests:
    name: iPhone UIKit tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the UIKit, Metal and recorded workflow tests on a fresh iPhone Duo
        run: |
          runtime=$(xcrun simctl list runtimes available --json | python3 -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r["name"].startswith("iOS 27.")
                      and any(t["name"] == "iPhone Duo" for t in r["supportedDeviceTypes"])]
          print(max(runtimes, key=lambda r: tuple(map(int, r["version"].split("."))))["identifier"])')
          udid=$(xcrun simctl create "Thrush tests" "iPhone Duo" "$runtime")
          xcrun simctl bootstatus "$udid" -b
          scripts/check-ios-ui.sh "$udid"

  iphone-proof:
    name: iPhone simulator proof
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Capture the packaged iPhone app
        env:
          CAPTURE_SCENE: ${{ inputs.scene }}
          CAPTURE_APPEARANCE: ${{ inputs.appearance }}
          CAPTURE_ORIENTATION: ${{ inputs.orientation }}
          CAPTURE_KEYBOARD: ${{ inputs.keyboard }}
          CAPTURE_ORACLE: ${{ inputs.oracle }}
          CAPTURE_LAYOUT_ONLY: ${{ inputs.layout_only }}
        run: |
          flags=()
          if [[ "$CAPTURE_LAYOUT_ONLY" == true ]]; then flags+=(--layout-only); fi
          python3 scripts/capture-simulator.py --output "$RUNNER_TEMP/thrush-iphone-proof" \
            --scene "$CAPTURE_SCENE" --appearance "${CAPTURE_APPEARANCE:-dark}" \
            --orientation "${CAPTURE_ORIENTATION:-portrait}" --keyboard "${CAPTURE_KEYBOARD:-any}" \
            --oracle "$CAPTURE_ORACLE" "${flags[@]}"
      - name: Upload captures and measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thrush-iphone-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/thrush-iphone-proof/*.png
            ${{ runner.temp }}/thrush-iphone-proof/*.mov
            ${{ runner.temp }}/thrush-iphone-proof/*.json
            ${{ runner.temp }}/thrush-iphone-proof/*.log
          compression-level: 0
          retention-days: 7

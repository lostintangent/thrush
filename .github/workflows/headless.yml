name: Headless checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  first-bytes:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          swift build
          swift test
      - name: Check core imports and package dependencies
        run: scripts/check-core.sh
      - name: Build the independent consumer and inspect linkage
        run: scripts/check-consumer.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Verify the loopback exchange
        run: scripts/check-loopback.sh
      - name: Verify the Release replay
        run: swift run -c release ThrushBench

name: Headless checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.png"
      - "Wasm/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.png"
      - "Wasm/**"

# Every push to main runs to completion, and a newer push waits rather than cancelling it.
# A newer pull request push supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          swift build
          swift test
      - name: Build the Mac and iPhone Simulator proofs apps
        run: |
          scripts/build-app.sh proofs mac
          scripts/build-app.sh proofs simulator
      - name: Check core imports and package dependencies
        run: scripts/check-core.sh
      - name: Link the public Thrush product for iPhone and iPhone Simulator, and wrap the simulator sample
        run: |
          scripts/check-swiftui-example.sh device
          scripts/check-swiftui-example.sh simulator
          scripts/build-app.sh sample simulator
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Check conformance against the pinned reference
        run: scripts/check-conformance.sh
      - name: Run the WebSocket check
        run: scripts/check-websocket.sh
      - name: Verify recorded shell, Vim and Codex workflows over WebSocket
        run: scripts/check-workflows.sh
      - name: Verify the Release benchmarks
        run: |
          swift run -c release ThrushBench
          python3 Benchmarks/check-benchmark-report.py

  iphone-tests:
    name: iPhone UIKit tests
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the UIKit, Metal and recorded workflow tests on a fresh iPhone Duo
        run: |
          runtime=$(xcrun simctl list runtimes available --json | python3 -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r["name"].startswith("iOS 27.")
                      and any(t["name"] == "iPhone Duo" for t in r["supportedDeviceTypes"])]
          print(max(runtimes, key=lambda r: tuple(map(int, r["version"].split("."))))["identifier"])')
          udid=$(xcrun simctl create "Thrush tests" "iPhone Duo" "$runtime")
          xcrun simctl bootstatus "$udid" -b
          scripts/check-ios-ui.sh "$udid"

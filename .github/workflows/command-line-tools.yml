name: Command Line Tools build

# Toy Box builds its Mac app with Command Line Tools, which have no Metal compiler and no SwiftUI macro plugin.
on:
  push:
    branches: [main]
    paths:
      - Package.swift
      - Sources/Thrush/**
      - Sources/ThrushUI/**
      - Sources/ThrushConnection/**
      - .github/workflows/command-line-tools.yml
  pull_request:
    paths:
      - Package.swift
      - Sources/Thrush/**
      - Sources/ThrushUI/**
      - Sources/ThrushConnection/**
      - .github/workflows/command-line-tools.yml

# A newer push supersedes a running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  libraries:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: swift --version
      - name: Build the libraries Toy Box links
        run: |
          swift build -c release --target ThrushConnection
          swift build -c release --target ThrushUI

name: Command Line Tools build

# Command Line Tools builds have no Metal compiler or SwiftUI macro plugin.
on:
  push:
    branches: [main]
    paths:
      - Package.swift
      - Sources/Thrush/**
      - Sources/ThrushCore/**
      - examples/swiftui/**
      - scripts/build-app.sh
      - scripts/check-sample.sh
      - .github/workflows/command-line-tools.yml
  pull_request:
    paths:
      - Package.swift
      - Sources/Thrush/**
      - Sources/ThrushCore/**
      - examples/swiftui/**
      - scripts/build-app.sh
      - scripts/check-sample.sh
      - .github/workflows/command-line-tools.yml

# A newer push supersedes a running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  libraries:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: swift --version
      - name: Link the public Thrush product in an external Mac app
        run: scripts/check-sample.sh mac
      - name: Wrap the sample as a Mac app
        run: scripts/build-app.sh sample mac

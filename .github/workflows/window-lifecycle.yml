name: Mac terminal window lifecycle
on:
  # The pane keeps its WebSocket in a covered, minimized or hidden Mac window. Every change that
  # could break that promise runs the default check.
  push:
    branches: [main]
    paths:
      - Package.swift
      - Sources/Thrush/**
      - Sources/ThrushCore/**
      - Sources/ThrushProofs/**
      - Sources/ThrushServer/**
      - examples/swiftui/**
      - scripts/build-app.sh
      - scripts/pty/**
      - Tests/ThrushWebSocketCheck/pty/**
      - .github/workflows/window-lifecycle.yml
  workflow_dispatch:
    inputs:
      voiceover:
        description: Read a terminal row with VoiceOver on the disposable Mac
        type: boolean
        default: false
      spinner_matrix:
        description: Check the cursor spinner and unchanged grid in both appearances
        type: boolean
        default: false
      text_blink:
        description: Measure and capture blinking and concealed text, with and without Reduce Motion
        type: boolean
        default: false
      program_colors:
        description: Capture colors a program sets under the title bar and a window toolbar in both appearances
        type: boolean
        default: false
      appearance_reports:
        description: Report each dark and light flip of the Mac window to programs on a real shell that set mode 2031
        type: boolean
        default: false
      links:
        description: Open the links scene's links with ⌘-clicks, tooltips and menus in both appearances
        type: boolean
        default: false
  workflow_call:
    inputs:
      voiceover: { type: boolean, default: false }
      spinner_matrix: { type: boolean, default: false }
      text_blink: { type: boolean, default: false }
      program_colors: { type: boolean, default: false }
      appearance_reports: { type: boolean, default: false }
      links: { type: boolean, default: false }
permissions:
  contents: read
# Every push to main runs to completion, and a newer push waits rather than cancelling it.
# Each dispatch runs on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false
jobs:
  window-lifecycle:
    runs-on: xcode-27
    timeout-minutes: ${{ (inputs.voiceover || inputs.text_blink || inputs.appearance_reports || inputs.links) && 25 || 12 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Cover, minimize and hide the packaged terminal beyond the shell orphan deadline
        if: ${{ !inputs.voiceover && !inputs.spinner_matrix && !inputs.text_blink && !inputs.program_colors && !inputs.appearance_reports && !inputs.links }}
        run: python3 scripts/pty/check-window.py --sample-server --output "$RUNNER_TEMP/window-lifecycle"
      - name: Read a named terminal row with macOS VoiceOver
        if: inputs.voiceover
        run: python3 scripts/interaction-capture/mac-voiceover.py --run-on-this-mac --output "$RUNNER_TEMP/window-lifecycle"
      - name: Check active and inactive Mac cursor spinners against the live grid
        if: inputs.spinner_matrix
        run: python3 scripts/capture-mac-spinners.py --prepare-hosted-motion --output "$RUNNER_TEMP/mac-spinners"
      - name: Measure and capture blinking text in both appearances
        if: ${{ !cancelled() && inputs.text_blink }}
        run: python3 scripts/capture-mac-text-blink.py --output "$RUNNER_TEMP/mac-text-blink"
      - name: Capture program colors under the title bar and a window toolbar
        if: ${{ !cancelled() && inputs.program_colors }}
        run: python3 scripts/capture-mac-program-colors.py --output "$RUNNER_TEMP/mac-program-colors"
      - name: Install Neovim to follow appearance reports
        if: inputs.appearance_reports
        run: brew install neovim
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
      - name: Report the Mac window's dark and light flips to programs on a real shell
        if: inputs.appearance_reports
        run: python3 scripts/capture-mac-appearance-reports.py --output "$RUNNER_TEMP/mac-appearance-reports"
      - name: Open links with ⌘-clicks, tooltips and menus in the packaged Mac window
        if: ${{ !cancelled() && inputs.links }}
        run: python3 scripts/interaction-capture/mac-links.py --output "$RUNNER_TEMP/mac-links"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (inputs.voiceover || !(inputs.spinner_matrix || inputs.text_blink || inputs.program_colors || inputs.appearance_reports || inputs.links))
        with:
          name: ${{ inputs.voiceover && 'thrush-mac-voiceover' || 'thrush-window-lifecycle' }}
          path: ${{ runner.temp }}/window-lifecycle/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.spinner_matrix
        with:
          name: thrush-mac-spinners
          path: ${{ runner.temp }}/mac-spinners/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.text_blink
        with:
          name: thrush-mac-text-blink
          path: ${{ runner.temp }}/mac-text-blink/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.program_colors
        with:
          name: thrush-mac-program-colors
          path: ${{ runner.temp }}/mac-program-colors/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.appearance_reports
        with:
          name: thrush-mac-appearance-reports
          path: ${{ runner.temp }}/mac-appearance-reports/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.links
        with:
          name: thrush-mac-links
          path: ${{ runner.temp }}/mac-links/

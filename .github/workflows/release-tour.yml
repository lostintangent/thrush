name: Release tour

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - proof: rendering
          - proof: interactions
          - proof: links
          - { scene: cursor-spinners, appearance: dark }
          - { scene: cursor-spinners, appearance: light }
          - { scene: toolbar-proof, appearance: dark }
          - { scene: toolbar-proof, appearance: light }
          - scene: program-colors
          - scene: text-blink
          - scene: under-bars
    uses: ./.github/workflows/iphone-proofs.yml
    with:
      proof: ${{ matrix.proof || 'rendering' }}
      scene: ${{ matrix.scene || '' }}
      appearance: ${{ matrix.appearance || '' }}

  mac:
    strategy:
      fail-fast: false
      matrix:
        proof: [spinners, text-blink, program-colors, appearance-reports, links]
    uses: ./.github/workflows/mac-proofs.yml
    with:
      proof: ${{ matrix.proof }}

  live:
    strategy:
      fail-fast: false
      matrix:
        platform: [simulator, mac]
        appearance: [dark, light]
    uses: ./.github/workflows/live-pty.yml
    with:
      platform: ${{ matrix.platform }}
      appearance: ${{ matrix.appearance }}

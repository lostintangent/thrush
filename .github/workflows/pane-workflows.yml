name: Native pane workflows

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [both, mac, simulator]
        default: both
      workflow:
        type: choice
        options: [all, shell, vim, codex, shell-and-codex, clear, clear-reference, echo-ab, echo-pixels, burst]
        default: all

      product-parent:
        description: Full product-parent SHA for native echo A/B
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native:
    if: inputs.workflow != 'echo-ab' && inputs.workflow != 'echo-pixels' && inputs.workflow != 'burst'
    name: Recorded workflows on ${{ matrix.platform }}
    runs-on: xcode-27
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'both' && '["mac","simulator"]' || format('["{0}"]', inputs.platform)) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Drive the native pane and capture its window
        env:
          PLATFORM: ${{ matrix.platform }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          if [[ "$WORKFLOW" == clear ]]; then
            if [[ "$PLATFORM" == mac ]]; then
              caffeinate -d -u -s python3 scripts/interaction-capture/clear.py "$PLATFORM" "$RUNNER_TEMP/pane-workflows"
            else
              python3 scripts/interaction-capture/clear.py "$PLATFORM" "$RUNNER_TEMP/pane-workflows"
            fi
            exit
          elif [[ "$WORKFLOW" == clear-reference ]]; then
            python3 scripts/interaction-capture/clear-reference.py "$RUNNER_TEMP/pane-workflows"
            exit
          fi
          case "$WORKFLOW" in
            all) workflows=() ;;
            shell-and-codex) workflows=(shell codex) ;;
            *) workflows=("$WORKFLOW") ;;
          esac
          if [[ "$PLATFORM" == simulator ]]; then
            scripts/check-pane-workflows.sh simulator new "$RUNNER_TEMP/pane-workflows" "${workflows[@]}"
          else
            scripts/check-pane-workflows.sh mac "$RUNNER_TEMP/pane-workflows" "${workflows[@]}"
          fi
      - name: Keep native screenshots and checkpoint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thrush-pane-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pane-workflows
          compression-level: ${{ inputs.workflow == 'clear' && matrix.platform == 'mac' && 6 || 0 }}
          retention-days: 7

  echo:
    name: Interleaved native single-key echo
    if: inputs.workflow == 'echo-ab' || inputs.workflow == 'echo-pixels'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - name: Install the pixel analyzer for the optical run
        if: inputs.workflow == 'echo-pixels'
        run: |
          python3 -m venv "$RUNNER_TEMP/echo-pixel-env"
          "$RUNNER_TEMP/echo-pixel-env/bin/pip" install numpy
          echo "$RUNNER_TEMP/echo-pixel-env/bin" >> "$GITHUB_PATH"
      - name: Compare the same native keystrokes in both Release builds
        env:
          PARENT: ${{ inputs.product-parent }}
          THRUSH_ECHO_PIXELS: ${{ inputs.workflow == 'echo-pixels' && '1' || '' }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          caffeinate -d -u -s python3 scripts/interaction-capture/echo-ab.py "$PARENT" "$PLATFORM" "$RUNNER_TEMP/echo-ab"
      - name: Compare matched input refreshes for individual native echoes
        if: ${{ always() && inputs.workflow == 'echo-pixels' }}
        run: |
          for side in mac simulator; do
            if test -d "$RUNNER_TEMP/echo-ab/$side"; then
              python3 scripts/interaction-capture/echo-phase.py "$RUNNER_TEMP/echo-ab/$side"
            fi
          done
      - name: Collect native producer encode cutoffs after the timing trials
        if: ${{ always() && inputs.workflow == 'echo-pixels' }}
        run: |
          mkdir -p "$RUNNER_TEMP/echo-ab/cutoffs"
          cp scripts/interaction-capture/residuals/{ProducerProbe.swift,peer.ts,run.sh} "$RUNNER_TEMP/echo-ab/cutoffs/"
          "$RUNNER_TEMP/echo-ab/cutoffs/run.sh" "$GITHUB_WORKSPACE"
      - name: Keep each key timestamp, run pair and source identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: thrush-native-echo-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/echo-ab
          retention-days: 7

  burst:
    name: Partial bursts on ${{ matrix.platform }}
    if: inputs.workflow == 'burst'
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'both' && '["mac","simulator"]' || format('["{0}"]', inputs.platform)) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - name: Count submitted and displayed partial bursts in both Release builds
        env:
          PLATFORM: ${{ matrix.platform }}
        run: caffeinate -d -u -s python3 scripts/interaction-capture/burst.py "$PLATFORM" "$RUNNER_TEMP/burst" --per-gap 48
      - name: Keep each frame report, gray recording and summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: thrush-burst-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/burst
          compression-level: 6
          retention-days: 7
